packages:
  - packages/*
  - tooling/*

# Every external version lives here. Package manifests use `catalog:`.
catalogMode: strict

catalog:
  "@eslint/js": 10.0.1
  "@types/node": 26.6.5
  eslint: 10.13.0
  globals: 17.13.0
  prettier: 3.9.10
  turbo: 2.11.10
  # typescript-eslint supports TypeScript below 6.1, so 7.x waits for it.
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
