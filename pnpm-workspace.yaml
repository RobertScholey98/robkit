packages:
  - packages/*
  - tooling/*

# Every external version lives here. Package manifests use `catalog:`.
catalogMode: strict

catalog:
  "@axe-core/playwright": 4.14.0
  "@base-ui/react": 1.9.0
  "@clack/prompts": 1.8.1
  "@eslint/js": 10.0.1
  "@fontsource-variable/geist": 5.3.0
  "@hono/node-server": 2.1.5
  "@hono/vite-dev-server": 0.26.1
  "@prisma/adapter-pg": 7.10.1
  "@prisma/client": 7.10.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.4
  "@types/node": 26.6.5
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  cn: 0.5.2
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.13.0
  globals: 17.13.0
  hono: 4.13.14
  jose: 6.2.13
  kysely: 0.29.8
  lucide-react: 1.66.0
  pg: 8.23.1
  playwright: 1.64.1
  postgres: 3.4.9
  prettier: 3.9.10
  prisma: 7.10.1
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.23.0
  tailwindcss: 4.3.3
  turbo: 2.11.10
  tw-animate-css: 1.4.0
  # typescript-eslint supports TypeScript below 6.1, so 7.x waits for it.
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
  yaml: 2.9.1

# esbuild ships its binary as an optional dependency, so its install script
# has nothing to do.
allowBuilds:
  esbuild: false
