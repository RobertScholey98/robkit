<!doctype html>
<!--
  The link preview image, public/preview.png, at 1200 by 630. `pnpm
  preview-image` opens this in Chromium and saves it. It takes its colours
  from the style guide's dark theme and the site's own fonts.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>robkit preview image</title>
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans Variable";
        font-weight: 100 700;
        src: url("../node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "JetBrains Mono Variable";
        font-weight: 100 800;
        src: url("../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2")
          format("woff2");
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }

      body {
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 72px 80px 64px;
        border-top: 6px solid var(--color-accent);
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: var(--font-mono);
        font-size: 44px;
        font-weight: 700;
      }

      .brand svg {
        color: var(--color-accent);
      }

      h1 {
        max-width: 980px;
        margin: 48px 0 0;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      .terminal {
        display: flex;
        gap: 18px;
        align-self: flex-start;
        margin-top: auto;
        padding: 22px 28px;
        border: 1px solid var(--color-border-control);
        border-radius: 10px;
        background: var(--color-code-bg);
        font-family: var(--font-mono);
        font-size: 30px;
      }

      .prompt {
        color: var(--color-muted);
      }

      .command {
        color: var(--color-code-function);
      }

      .address {
        position: absolute;
        right: 80px;
        bottom: 76px;
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg
        width="52"
        height="52"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
        <path d="m7 11 2-2-2-2m4 6h4"></path>
      </svg>
      robkit
    </div>
    <h1>A kit for self-hosting small apps for your friends and family.</h1>
    <div class="terminal">
      <span class="prompt">$</span>
      <span><span class="command">pnpm</span> robkit add notes</span>
    </div>
    <div class="address">robkit.dev</div>
  </body>
</html>
