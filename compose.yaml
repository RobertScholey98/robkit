# Postgres for local development. Every app gets its own schema and role in
# the robkit database; `pnpm dev` provisions them.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robkit
    ports:
      - "127.0.0.1:${ROBKIT_POSTGRES_PORT:-54320}:5432"
    volumes:
      # Postgres 18 images keep data under a versioned folder in /var/lib/postgresql.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "robkit"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres:
