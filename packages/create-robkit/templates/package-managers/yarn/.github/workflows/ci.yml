name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The yarn packageManager in package.json names, without Corepack.
      # --force replaces the Yarn 1 the runner ships.
      - run: npm install --global --force "@yarnpkg/cli-dist@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: yarn install --immutable
      - run: yarn run lint
      # An install without Prettier has no format:check, and yarn run has
      # no --if-present.
      - run: |
          if node -e "process.exit('format:check' in require('./package.json').scripts ? 0 : 1)"; then
            yarn run format:check
          fi
      - run: yarn run typecheck
      - run: yarn run test
      - run: yarn run build
      # Only an install with Playwright has browser tests. They run yarn run dev,
      # which starts Postgres in Docker.
      - if: hashFiles('tooling/e2e/playwright.config.ts') != ''
        working-directory: tooling/e2e
        run: yarn playwright install --with-deps chromium
      - if: hashFiles('tooling/e2e/playwright.config.ts') != ''
        run: yarn run test:e2e

  # Deploys to Coolify once main passes its checks. Until the repository has
  # a COOLIFY_URL secret it deploys nothing and passes. See docs/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo compares against the commit before the push.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global --force "@yarnpkg/cli-dist@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: yarn install --immutable
      - run: yarn run robkit deploy
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
