# Install into node_modules, as pnpm and bun do. Never Plug'n'Play.
nodeLinker: node-modules

# Keep yarn's install state beside what it describes, out of the repository.
installStatePath: node_modules/.yarn-install-state.gz

# Refuse any version published less than a day ago.
npmMinimalAgeGate: 1d

# Run no install scripts but the ones dependenciesMeta in package.json
# marks as built.
enableScripts: false
