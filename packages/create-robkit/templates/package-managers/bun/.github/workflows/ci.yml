name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the bun version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The apps run on Node; bun installs and runs their scripts.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # An install without Prettier has no format:check.
      - run: bun run --if-present format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # Deploys to Coolify once main passes its checks. Until the repository has
  # a COOLIFY_URL secret it deploys nothing and passes. See docs/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo compares against the commit before the push.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run robkit deploy
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
