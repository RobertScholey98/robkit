# Postgres for local development. Every app gets its own schema and role in
# the robkit database; `pnpm dev` provisions them.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robkit
    ports:
      - "127.0.0.1:${ROBKIT_POSTGRES_PORT:-54320}:5432"
    volumes:
      # Postgres 18 images keep data under a versioned folder in /var/lib/postgresql.
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP, because the image's first-run setup server listens only on
      # the socket and would pass a socket check before Postgres restarts.
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "postgres",
          "-d",
          "robkit",
        ]
      # Every second while Postgres starts, which takes longer on a busy
      # machine, then every 10 seconds. Docker runs each check as an exec, and
      # on Docker Desktop a stream of them slows every other Docker command.
      start_period: 120s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres:
