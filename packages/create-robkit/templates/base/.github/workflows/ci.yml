name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push cancels a pull request's run in progress. On main every run
# finishes, so each push's checks and deploy run in turn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # A React + Go app lints, checks, tests and builds with Go's tools.
      - if: hashFiles('apps/*/go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: apps/*/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # An install without Prettier has no format:check.
      - run: pnpm run --if-present format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Deploys to Coolify once main passes its checks. Until the repository has
  # a COOLIFY_URL secret it deploys nothing and passes. See docs/deploy.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # robkit deploy compares each app against the commit its last
          # finished deploy recorded, so it needs the whole history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm robkit deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
