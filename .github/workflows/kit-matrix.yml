name: Kit matrix

# Makes one generated install per job, from init's flags, and runs its own
# CI workflow's steps. ci.yml calls it with each pull request's pairwise
# set, and nightly.yml with every combination. A job is named by the flags
# that make its install, so a broken combination names itself.
on:
  workflow_call:
    inputs:
      set:
        description: The combinations to make, pull-request or nightly.
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      combinations: ${{ steps.plan.outputs.combinations }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: echo "combinations=$(node tooling/matrix/src/plan.ts "$SET")" >> "$GITHUB_OUTPUT"
        env:
          SET: ${{ inputs.set }}

  combination:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Every combination runs to the end, so one failure doesn't hide
      # another, and none may fail: bun's and yarn's are as required as
      # pnpm's.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.combinations) }}
    env:
      # An install with Playwright runs its own dev stack in Chromium. See
      # ci.yml for why its Postgres runs on the host's network.
      COMPOSE_FILE: compose.yaml:${{ github.workspace }}/tooling/test-postgres/host-network.yaml
      E2E_COMBINATION: ${{ toJSON(matrix.flags) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @internal/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run test:combination --filter=@internal/e2e

  # One check that holds every combination, whatever the set holds. This
  # is the one to require on a protected branch.
  every-combination:
    name: Every combination
    needs: combination
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success || { echo "A combination failed. Its job is named by its init flags."; exit 1; }
        env:
          RESULT: ${{ needs.combination.result }}
