name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # It takes 13 to 17 minutes. A hung test stops here, not at GitHub's
    # six hours.
    timeout-minutes: 45
    env:
      # Every test Postgres runs on the host's network, so starting one adds
      # no interface and Chromium's pages don't fail with ERR_NETWORK_CHANGED.
      # See the file for why.
      COMPOSE_FILE: compose.yaml:${{ github.workspace }}/tooling/test-postgres/host-network.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Go module's checks, and the React + Go install the whole-stack
      # test makes, run Go's own tools.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go/go.mod
            packages/create-robkit/templates/stacks/go/go.sum
      - run: pnpm install --frozen-lockfile
      # The end-to-end journey drives the stack in Chromium.
      - run: pnpm --filter @internal/e2e exec playwright install --with-deps chromium
      - run: pnpm check:all
        env:
          # Turbo writes each task's times to .turbo/runs/, for the summary.
          TURBO_RUN_SUMMARY: "true"
      # The job summary lists each test task's time, the whole-stack test's
      # among them.
      # It prints them in the log too. `shell: bash` sets pipefail, so the
      # step still fails if the script does.
      - if: ${{ !cancelled() }}
        shell: bash
        run: node tooling/repo-checks/src/print-test-times.ts | tee -a "$GITHUB_STEP_SUMMARY"
      # Fails on a coverage threshold more than 2 points under what this run
      # just measured, and says what to raise it to.
      - run: node tooling/repo-checks/src/check-coverage-ratchet.ts
      # Each package's coverage report, to see what its tests miss.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            packages/*/coverage/
            tooling/*/coverage/
            site/coverage/
      # The docs site as the gate built it: static files any host can serve.
      # CONTRIBUTING.md says how to look at it.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/dist/
          if-no-files-found: error

  # What a pull request's own changes must keep to, checked against its base.
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # It takes about a minute.
    timeout-minutes: 15
    permissions:
      contents: read
      # Reads the pull request's body for its ticket.
      pull-requests: read
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same check the commit-msg hook runs, on every commit but merges.
      - run: node tooling/repo-checks/src/check-commit-subjects.ts --range "$BASE..HEAD"
      - run: node tooling/repo-checks/src/check-coverage-thresholds.ts "$BASE"
      # Fails when a published package changed and no new changeset names it.
      - run: node tooling/repo-checks/src/check-changesets.ts "$BASE"
      # Builds and packs every package as the release would publish it, and
      # checks the tarballs. It makes no call to npm.
      - run: pnpm release:dry-run
      # Fails when main's ruleset stops requiring a pull request and gate, or
      # stops blocking force pushes and deletion. `shell: bash` sets
      # pipefail, so the step fails if gh does.
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" | node tooling/repo-checks/src/check-branch-rules.ts
      # The Ticket section must name a ticket file that exists. It reads the
      # body now, not from the event, so a re-run sees an edited body. A
      # bot's pull request, such as Renovate's, works no ticket.
      - if: github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: PR_BODY="$(gh pr view "$PR" --json body --jq .body)" node tooling/repo-checks/src/check-pr-ticket.ts

  # Go's vet and tests on the oldest Go the docs promise, which go/go.mod
  # names. check runs them on the newest. go-version.test.ts holds the docs,
  # both go.mod files and this job to one version.
  go-oldest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.mod
            packages/create-robkit/templates/stacks/go/go.sum
      - working-directory: go
        run: go vet ./... && go test ./...
      # The template finds robkit's Go module in vendor/robkit/go, which an
      # install has and this checkout doesn't, so point it at go/ here.
      - working-directory: packages/create-robkit/templates/stacks/go
        run: |
          go mod edit -replace=github.com/RobertScholey98/robkit/go=../../../../../go
          go vet ./... && go test ./...

  # The one check branch protection requires. It passes only if every job
  # above passed, or was skipped because it runs only on pull requests.
  gate:
    if: ${{ always() }}
    needs: [check, pull-request, go-oldest]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || (github.event_name == 'pull_request' && contains(needs.*.result, 'skipped')) }}
        run: exit 1
