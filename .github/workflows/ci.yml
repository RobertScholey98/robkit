name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Every test Postgres runs on the host's network, so starting one adds
      # no interface and Chromium's pages don't fail with ERR_NETWORK_CHANGED.
      # See the file for why.
      COMPOSE_FILE: compose.yaml:${{ github.workspace }}/tooling/test-postgres/host-network.yaml
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The end-to-end journey drives the stack in Chromium.
      - run: pnpm --filter @internal/e2e exec playwright install --with-deps chromium
      - run: pnpm turbo run lint typecheck test
      # Each package's coverage report, to see what its tests miss.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            packages/*/coverage/
            tooling/*/coverage/

  # What a pull request's own changes must keep to, checked against its base.
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same check the commit-msg hook runs, on every commit but merges.
      - run: node tooling/repo-checks/src/check-commit-subjects.ts --range "$BASE..HEAD"
