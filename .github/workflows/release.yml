# The release: a button that publishes what is on main and npm lacks.
# CONTRIBUTING.md's "Releasing" says when to press it, and what to set up
# first. tooling/repo-checks/src/release-workflow.test.ts holds this file
# to what the release needs.
#
# Every action is pinned to a commit, with its version beside it, since the
# publish job holds the npm token.
name: Release

on:
  workflow_dispatch:

# One release at a time. A second waits rather than stopping the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The full gate, as CI runs it. It runs every dev dependency's code, so it
  # holds no secret and can only read.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # As in ci.yml: each test Postgres runs on the host's network.
      COMPOSE_FILE: compose.yaml:${{ github.workspace }}/tooling/test-postgres/host-network.yaml
    steps:
      # GitHub can start a by-hand workflow from any branch that holds this
      # file. Only main releases.
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "The release runs only from main, and this run is on $GITHUB_REF. Start it again from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No caches: a release builds from nothing a pull request could have
      # left behind.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @internal/e2e exec playwright install --with-deps chromium
      - run: pnpm check:all

  # Publishes every package whose version on main npm lacks, then tags the
  # release. It runs in the release environment, which R limits to main and
  # can make wait for a reviewer.
  publish:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The tag.
      contents: write
      # npm's provenance, which links each version to this run.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Builds every package, packs each one as the publish will, and checks
      # the tarballs. It makes no call to npm.
      - run: pnpm release:dry-run
      # The one step with the npm token. It stops before anything else if
      # the token is missing. It publishes through pnpm, never npm: only
      # pnpm swaps in publishConfig's exports and bin, and turns workspace:
      # and catalog: into versions, as it packs. Each package npm already
      # has at this version is left out, so a release that stopped halfway
      # runs again from where it stopped.
      - id: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node tooling/repo-checks/src/release-publish.ts
      # One tag, v<version>, once npm has every package. GitHub's API makes
      # it on this run's commit, so there is no commit and no git login.
      - if: steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG is already tagged."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
            echo "Tagged $GITHUB_SHA as $TAG."
          fi
