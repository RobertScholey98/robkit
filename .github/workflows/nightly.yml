name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every package manager, ORM, UI option and first stack: 72 installs.
  kit-matrix:
    uses: ./.github/workflows/kit-matrix.yml
    with:
      set: nightly

  # Every production install, deployed and taken through over https.
  production:
    uses: ./.github/workflows/production.yml
